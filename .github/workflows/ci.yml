name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  contract:
    name: Contract (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: wasm32v1-none
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Check formatting
        run: cargo fmt --check --manifest-path contracts/airdrop/Cargo.toml
      - name: Run clippy
        run: cargo clippy --manifest-path contracts/airdrop/Cargo.toml -- -D warnings
      - name: Run tests
        run: cargo test --manifest-path contracts/airdrop/Cargo.toml
      - name: Build WASM
        run: cargo build --manifest-path contracts/airdrop/Cargo.toml --target wasm32v1-none --release

  sdk:
    name: SDK + CLI (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: "9"
      - name: Install & build SDK
        run: |
          pnpm install --no-frozen-lockfile
          pnpm build
        working-directory: sdk
      - name: Test SDK
        run: pnpm test
        working-directory: sdk
      - name: Install & build CLI
        run: |
          pnpm install --no-frozen-lockfile
          pnpm build
        working-directory: cli
      - name: Test CLI
        run: pnpm test
        working-directory: cli

  web:
    name: Web (Next.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: "9"
      - name: Install & build SDK
        run: |
          pnpm install --no-frozen-lockfile
          pnpm build
        working-directory: sdk
      - name: Install web
        run: pnpm install --no-frozen-lockfile
        working-directory: web
      - name: Lint
        run: pnpm lint
        working-directory: web
        continue-on-error: true
      - name: Build
        run: pnpm build
        working-directory: web
        env:
          AIRDROP_CONTRACT_ID: placeholder
          NETWORK: testnet
